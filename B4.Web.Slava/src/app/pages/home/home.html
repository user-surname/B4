<div class="auth-container">
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="onSubmit()">

    <label for="email">Correo:</label>
    <input id="email" type="email" [(ngModel)]="credentials.email" name="email" required>

    <label for="password">Contraseña:</label>
    <input id="password" type="password" [(ngModel)]="credentials.password" name="password" required>

    <button type="submit" [disabled]="loading">Entrar</button>

  </form>

  <!-- Mensaje fuera del form -->
  <div class="message" *ngIf="message" 
       [ngClass]="{'error-msg': message.includes('Error'), 'success-msg': message.includes('exitosa')}">
    {{ message }}
  </div>
</div>
