<h1>Lista de Ciclos</h1>

<table border="1" cellpadding="5" cellspacing="0">
  <thead>
    <tr>
      <th>Id</th>
      <th>Id Ciclo</th>
      <th>Ciclo</th>
      <th>Descripción</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let ciclo of ciclos">
      <td>{{ ciclo.id }}</td>
      <td>{{ ciclo.idCiclo }}</td>
      <td>{{ ciclo.ciclo }}</td>
      <td>{{ ciclo.descripcion }}</td>
    </tr>
  </tbody>
</table>
