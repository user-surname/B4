services:
  api:
    build:
      context: .
      dockerfile: B4.Api/Dockerfile
    container_name: b4-api
    ports:
      - "5000:5000"

  frontend:
    build: ./B4.Web.Slava
    container_name: b4-frontend
    ports:
      - "4200:80"
    environment:
      - API_URL=http://api:5000/api/v1
    depends_on:
      - api